name: Subagent Runner

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task description for the autonomous subagent"
        required: true
        type: string
      branch:
        description: "Branch to commit fixes and open PR from"
        required: false
        default: ""
        type: string
      model:
        description: "Preferred model for LLM inference"
        required: false
        default: "openrouter/free"
        type: string

jobs:
  run-subagent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright & Headless Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start Headless Chromium CDP Daemon (:9222)
        run: |
          python -m playwright install chromium
          CHROME_BIN=$(python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()")
          "$CHROME_BIN" --headless=new --no-sandbox --disable-gpu --remote-debugging-port=9222 about:blank &
          sleep 2
          curl -s http://127.0.0.1:9222/json/version || echo "CDP starting..."

      - name: Run Cloud Subagent Task
        env:
          HOMELAB_LITELLM_URL: ${{ secrets.HOMELAB_LITELLM_URL }}
          HOMELAB_LITELLM_KEY: ${{ secrets.HOMELAB_LITELLM_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TASK_PROMPT: ${{ inputs.task }}
          PREFERRED_MODEL: ${{ inputs.model }}
        run: |
          chmod +x scripts/*.sh .agents/skills/*/scripts/*.sh .agents/skills/*/scripts/*.py 2>/dev/null || true
          
          # Test homelab GPU connectivity or fallback
          if [[ -f scripts/connect_homelab_gpu.sh ]]; then
            source scripts/connect_homelab_gpu.sh || true
          fi

          python3 .agents/skills/openrouter-free/scripts/or_agent.py \
            --prompt "$TASK_PROMPT" \
            --model "$PREFERRED_MODEL" \
            --max-turns 15

      - name: Create Pull Request if Changes Generated
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH_NAME: ${{ inputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n "$(git status --porcelain)" ]]; then
            TARGET_BRANCH="${BRANCH_NAME:-agent/subtask-${{ github.run_id }}}"
            git checkout -b "$TARGET_BRANCH"
            git add -A
            git commit -m "feat(subagent): autonomously resolved task: ${{ inputs.task }}"
            git push origin "$TARGET_BRANCH"
            
            gh pr create \
              --title "feat(subagent): ${{ inputs.task }}" \
              --body "Autonomously generated by GitHub Actions subagent (Run #${{ github.run_id }})." \
              --base main \
              --head "$TARGET_BRANCH" || true
          else
            echo "No code changes produced by subagent."
          fi

      - name: Upload Artifacts & Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subagent-run-${{ github.run_id }}
          path: |
            /tmp/*.png
            /tmp/*.log
            /tmp/*.json
          if-no-files-found: ignore
